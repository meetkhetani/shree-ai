<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0048FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Icon: Neural Network Brain -->
  <g transform="translate(10, 10)">
    <!-- Neural Network Nodes -->
    <g filter="url(#logoGlow)">
      <!-- Center Node (Brain Core) -->
      <circle cx="40" cy="40" r="12" fill="url(#logoGradient)"/>
      
      <!-- Top Layer -->
      <circle cx="25" cy="20" r="5" fill="#0048FF"/>
      <circle cx="40" cy="15" r="5" fill="#0048FF"/>
      <circle cx="55" cy="20" r="5" fill="#0048FF"/>
      
      <!-- Middle Layer -->
      <circle cx="15" cy="40" r="6" fill="#0048FF"/>
      <circle cx="65" cy="40" r="6" fill="#0048FF"/>
      
      <!-- Bottom Layer -->
      <circle cx="25" cy="60" r="5" fill="#FFD700"/>
      <circle cx="40" cy="65" r="5" fill="#FFD700"/>
      <circle cx="55" cy="60" r="5" fill="#FFD700"/>
    </g>
    
    <!-- Connection Lines -->
    <g stroke="url(#logoGradient)" stroke-width="1.5" opacity="0.4" fill="none">
      <line x1="25" y1="20" x2="40" y2="40"/>
      <line x1="40" y1="15" x2="40" y2="40"/>
      <line x1="55" y1="20" x2="40" y2="40"/>
      <line x1="15" y1="40" x2="40" y2="40"/>
      <line x1="65" y1="40" x2="40" y2="40"/>
      <line x1="40" y1="40" x2="25" y2="60"/>
      <line x1="40" y1="40" x2="40" y2="65"/>
      <line x1="40" y1="40" x2="55" y2="60"/>
    </g>
    
    <!-- AI Symbol -->
    <text x="40" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
          text-anchor="middle" fill="white">AI</text>
  </g>
  
  <!-- Company Name -->
  <g transform="translate(90, 0)">
    <!-- "SHREE" Text -->
    <text x="0" y="45" font-family="'Space Grotesk', sans-serif" font-size="36" font-weight="700" 
          fill="url(#logoGradient)">SHREE</text>
    
    <!-- "AI" Text -->
    <text x="140" y="45" font-family="'Space Grotesk', sans-serif" font-size="36" font-weight="700" 
          fill="url(#logoGradient)">AI</text>
    
    <!-- Tagline -->
    <text x="0" y="68" font-family="'Inter', sans-serif" font-size="11" font-weight="500" 
          fill="#6B7280" letter-spacing="2">WE CODE INTELLIGENCE</text>
  </g>
</svg>
