<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0048FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#brainGradient)" opacity="0.1"/>
  
  <!-- Neural Network Nodes -->
  <g filter="url(#glow)">
    <!-- Center Node (Brain Core) -->
    <circle cx="100" cy="100" r="20" fill="url(#brainGradient)"/>
    
    <!-- Top Layer Nodes -->
    <circle cx="70" cy="50" r="8" fill="#0048FF"/>
    <circle cx="100" cy="40" r="8" fill="#0048FF"/>
    <circle cx="130" cy="50" r="8" fill="#0048FF"/>
    
    <!-- Middle Layer Nodes -->
    <circle cx="50" cy="100" r="10" fill="#0048FF"/>
    <circle cx="150" cy="100" r="10" fill="#0048FF"/>
    
    <!-- Bottom Layer Nodes -->
    <circle cx="70" cy="150" r="8" fill="#FFD700"/>
    <circle cx="100" cy="160" r="8" fill="#FFD700"/>
    <circle cx="130" cy="150" r="8" fill="#FFD700"/>
  </g>
  
  <!-- Connection Lines -->
  <g stroke="url(#brainGradient)" stroke-width="2" opacity="0.6" fill="none">
    <!-- Top to Center -->
    <line x1="70" y1="50" x2="100" y2="100"/>
    <line x1="100" y1="40" x2="100" y2="100"/>
    <line x1="130" y1="50" x2="100" y2="100"/>
    
    <!-- Middle to Center -->
    <line x1="50" y1="100" x2="100" y2="100"/>
    <line x1="150" y1="100" x2="100" y2="100"/>
    
    <!-- Center to Bottom -->
    <line x1="100" y1="100" x2="70" y2="150"/>
    <line x1="100" y1="100" x2="100" y2="160"/>
    <line x1="100" y1="100" x2="130" y2="150"/>
  </g>
  
  <!-- AI Symbol in Center -->
  <text x="100" y="108" font-family="Arial, sans-serif" font-size="20" font-weight="bold" 
        text-anchor="middle" fill="white">AI</text>
</svg>
