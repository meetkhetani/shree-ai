<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="assets/logo.svg" alt="Shree AI Logo" style="height: 50px;">
                <span style="background: linear-gradient(135deg, #FFD700, #FFA500); color: white; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; margin-left: 0.5rem; font-weight: 700;">BETA</span>
            </a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
                <li><a href="products.html" class="nav-link">Products</a></li>
                <li><a href="developers.html" class="nav-link">Developers</a></li>
                <li><a href="demo.html" class="nav-link active">AI Demos</a></li>
                <li><a href="automations.html" class="nav-link">Automations</a></li>
                <li><a href="pricing.html" class="nav-link">Pricing</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
            </ul>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </nav>

    <section class="page-header">
        <div class="container">
            <div class="page-header-content" data-aos="fade-up">
                <div style="display: inline-block; padding: 0.5rem 1rem; background: rgba(0, 72, 255, 0.1); border-radius: var(--radius-full); margin-bottom: 1rem;">
                    <a href="demo.html" style="color: var(--color-primary); text-decoration: none; font-weight: 600;">
                        <i class="fas fa-arrow-left"></i> Back to AI Demos
                    </a>
                </div>
                <h1><i class="fas fa-volume-up"></i> Text-to-Speech</h1>
                <p>Convert text to natural-sounding speech instantly</p>
            </div>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="demo-container" data-aos="fade-up">
                <div class="demo-body">
                    <div style="margin-bottom: 1.5rem; padding: 1rem; background: linear-gradient(135deg, rgba(0, 72, 255, 0.05), rgba(255, 215, 0, 0.05)); border: 2px dashed var(--color-primary); border-radius: var(--radius-md); text-align: center;">
                        <p style="margin: 0 0 0.75rem; color: var(--text-secondary); font-weight: 600;">
                            <i class="fas fa-info-circle"></i> Test if speech is working:
                        </p>
                        <button class="btn btn-primary" onclick="testSpeech()">
                            <i class="fas fa-play"></i> Quick Test Speech
                        </button>
                        <div id="testStatus" style="margin-top: 0.75rem; color: var(--text-secondary); font-size: 0.875rem; font-weight: 600;"></div>
                    </div>
                    
                    <div class="demo-input-area">
                        <label for="ttsInput">Enter text to convert:</label>
                        <textarea id="ttsInput" rows="6" placeholder="Type any text here and we'll convert it to speech..."></textarea>
                        
                        <div class="tts-options">
                            <div class="option-group">
                                <label>Voice:</label>
                                <select id="voiceSelect">
                                    <option value="female">Female (Natural)</option>
                                    <option value="male">Male (Professional)</option>
                                    <option value="robotic">Robotic (Fun)</option>
                                </select>
                            </div>
                            
                            <div class="option-group">
                                <label>Speed:</label>
                                <select id="speedSelect">
                                    <option value="0.5">Slow (0.5x)</option>
                                    <option value="1" selected>Normal (1x)</option>
                                    <option value="1.5">Fast (1.5x)</option>
                                    <option value="2">Very Fast (2x)</option>
                                </select>
                            </div>
                        </div>
                        
                        <button class="btn btn-primary btn-lg" onclick="generateSpeech()">
                            <i class="fas fa-play"></i> Generate Speech
                        </button>
                    </div>
                    
                    <div class="demo-output-area" id="ttsOutput" style="display: none;"></div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 Shree AI. Made with <i class="fas fa-heart"></i> in Kutch, Gujarat.</p>
            </div>
        </div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/ai-agent.js"></script>
    <script src="js/demo.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
