    <section class="page-header">
        <div class="container">
            <div class="page-header-content" data-aos="fade-up">
                <div style="display: inline-block; padding: 0.5rem 1rem; background: rgba(0, 72, 255, 0.1); border-radius: var(--radius-full); margin-bottom: 1rem;">
                    <a href="automations.html" style="color: var(--color-primary); text-decoration: none; font-weight: 600;">
                        <i class="fas fa-arrow-left"></i> Back to Automations
                    </a>
                </div>
                <h1><i class="fas fa-shopping-cart"></i> Supermart Automation</h1>
                <p>Complete AI-powered automation for small supermarkets</p>
            </div>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="demo-container" data-aos="fade-up">
                <div class="demo-body">
                    <div class="demo-input-area">
                        <label for="supermartInput">Store Details & Requirements:</label>
                        <textarea id="supermartInput" rows="6" placeholder="E.g., Small supermart, 800 sq ft, 3 staff members, 500+ SKUs, daily footfall 150-200 customers...">Local supermart in Andheri, Mumbai. 800 sq ft space, 3 staff (1 manager, 2 cashiers), 500+ products, daily customers 150-200, current issues: manual inventory, stock-outs, long checkout queues, no customer loyalty program</textarea>
                        
                        <div style="margin: 1rem 0; padding: 1rem; background: var(--bg-secondary); border-radius: var(--radius-md);">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Select Automation Modules:</label>
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.75rem;">
                                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                    <input type="checkbox" id="module-inventory" checked style="width: 18px; height: 18px;">
                                    <span>📦 Smart Inventory</span>
                                </label>
                                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                    <input type="checkbox" id="module-pos" checked style="width: 18px; height: 18px;">
                                    <span>💳 Smart POS</span>
                                </label>
                                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                    <input type="checkbox" id="module-customer" checked style="width: 18px; height: 18px;">
                                    <span>👥 Customer Analytics</span>
                                </label>
                                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                    <input type="checkbox" id="module-staff" checked style="width: 18px; height: 18px;">
                                    <span>👨‍💼 Staff Management</span>
                                </label>
                                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                    <input type="checkbox" id="module-supplier" checked style="width: 18px; height: 18px;">
                                    <span>🚚 Supplier Auto-Order</span>
                                </label>
                                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                    <input type="checkbox" id="module-pricing" checked style="width: 18px; height: 18px;">
                                    <span>💰 Dynamic Pricing</span>
                                </label>
                            </div>
                        </div>
                        
                        <button class="btn btn-primary btn-lg" onclick="generateSupermartAutomation()">
                            <i class="fas fa-magic"></i> Generate Complete Automation System
                        </button>
                    </div>
                    
                    <div class="demo-output-area" id="supermartOutput" style="display: none;">
                        <h4><i class="fas fa-robot"></i> AI-Generated Supermart Automation Plan:</h4>
                        <div id="supermartAnalysis"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>
